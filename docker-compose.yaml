# Produccion Odoo 19.0 (detras de nginx).
# La produccion anterior (Odoo 17.0) se conserva en docker-compose-17.yaml.
# Ambos stacks publican los puertos 80/443: baja uno antes de levantar el otro.
services:
    db_retana_prod_19:
        image: postgres:15
        volumes:
            - odoo_pg_data_retana_prod_19:/var/lib/postgresql/data
        environment:
            - POSTGRES_DB=postgres
            - POSTGRES_PASSWORD=odoo
            - POSTGRES_USER=odoo
        restart: always
        container_name: db_retana_prod_19

    odoo_19_retana_prod:
        image: odoo:19
        depends_on:
            - db_retana_prod_19
        expose:
            - "8069"
            - "8072"
        volumes:
            - odoo_data_retana_prod_19:/var/lib/odoo
            - ./extra-addons:/mnt/extra-addons
            - ./config/prod.conf:/etc/odoo/odoo.conf
            - ./odoo-filestore-19:/root/.local/share/Odoo/filestore
        environment:
            - HOST=db_retana_prod_19
            - USER=odoo
            - PASSWORD=odoo
            # la imagen de Odoo 19 usa un Python que bloquea pip a nivel de sistema (PEP 668)
            - PIP_BREAK_SYSTEM_PACKAGES=1
        restart: always
        container_name: odoo_19_retana_prod
        user: "root"
        command: bash -c "pip install --no-cache-dir -r /mnt/extra-addons/requirements.txt && apt-get update && apt-get install -y tesseract-ocr tesseract-ocr-spa && /usr/bin/odoo -c /etc/odoo/odoo.conf"

    nginx:
        image: nginx:alpine
        depends_on:
            - odoo_19_retana_prod
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
            - ./nginx/ssl:/etc/nginx/ssl:ro
        restart: always
        container_name: nginx_retana_19

volumes:
    odoo_pg_data_retana_prod_19:
    odoo_data_retana_prod_19:
