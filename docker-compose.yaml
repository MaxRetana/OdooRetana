version: '3'
services:
  db_retana:
    image: postgres:15
    volumes:
      - odoo_pg_data_retana:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=odoo
      - POSTGRES_USER=odoo
    restart: always
    container_name: db_retana

  odoo_17_retana:
    image: odoo:17
    depends_on:
      - db_retana
    ports:
      - "8080:8069"
    volumes:
      - odoo_data_retana:/var/lib/odoo
      - ./extra-addons:/mnt/extra-addons
      - ./config/local.conf:/etc/odoo/odoo.conf
      - ./odoo-filestore:/var/lib/odoo/.local/share/Odoo/filestore   # 🔥 Nuevo volumen persistente
    environment:
      - HOST=db_retana
      - USER=odoo
      - PASSWORD=odoo
    restart: always
    container_name: odoo_17_retana
    user: "root"
    command: bash -c "pip install --no-cache-dir -r /mnt/extra-addons/requirements.txt && apt-get update && apt-get install -y tesseract-ocr tesseract-ocr-spa && /usr/bin/odoo -c /etc/odoo/odoo.conf --dev all"

volumes:
  odoo_pg_data_retana:
  odoo_data_retana:
